tips:
  t0: "输入 /yolo 跳过当前会话所有危险命令的审批。"
  t1: "使用 /retry 用相同提示词重新生成最后一条回复。"
  t2: "使用 /undo 回退 N 轮对话并从那里继续。"
  t3: "用 /model gpt-4o 或 /model claude-sonnet-4 随时切换模型。"
  t4: "输入 /compact 强制上下文摘要以节省 tokens。"
  t5: "使用 @diff 将未暂存的 git 变更注入提示。"
  t6: "输入 @file:path/to/file 将文件内容内联附加。"
  t7: "使用 @git:5 注入最近 5 条 commit 消息到上下文。"
  t8: "用 /save 保存会话，之后用 /resume 恢复。"
  t9: "输入 /memory user 查看 agent 记住的关于你的信息。"
  t10: "输入 /memory agent 查看 agent 为当前项目存储的内容。"
  t11: "使用 /rewind 跳回对话的任意早前轮次。"
  t12: "厌倦了审批 npm install？选择 'a' 永久批准，不再询问。"
  t13: "输入 /mode code 使用编程专注 agent，或 /mode general 通用模式。"
  t14: "使用 /background 启动长时间运行的 agent 任务，同时继续工作。"
  t15: "用 /queue 查看正在运行的后台任务。"
  t16: "设置 COVO_YOLO=1 启动时绕过所有审批。"
  t17: "在 config.yaml 中添加 approvals.mode: smart，让小型 LLM 自动批准安全命令。"
  t18: "使用 /stats 查看本会话的 token 用量和费用预估。"
  t19: "输入 /status 查看一行式会话概览。"
  t20: "使用 /provider openai 快速切换 AI provider。"
  t21: "运行 /skill 查看 agent 可用的技能列表。"
  t22: "输入 /curator 触发维护来清理过时技能。"
  t23: "运行 /skill <name> 查看特定技能的使用统计。"
  t24: "使用 /steer <id> <msg> 向运行中的后台任务发送中期指令。"
  t25: "输入 /cancel <id> 停止后台任务。"
  t26: "审批提示时: y=单次, s=本会话, a=永久, n=拒绝。"
  t27: "危险命令审批使用模式匹配——`ls` 这样的安全命令直接通过。"
  t28: "硬核模式如 `rm -rf /` 即使 YOLO 模式下也会被阻止。"
  t29: "状态栏显示当前模式、git 分支和 token 用量。"
  t30: "使用 /statusline 自定义状态栏显示内容。"
  t31: "按 Ctrl+C 中断 agent 的回复。"
  t32: "按 Tab 自动补全斜杠命令和 @ 引用。"
  t33: "使用 上/下 方向键浏览命令历史。"
  t34: "使用 COVO_WORKTREE=true 在 git worktree 中隔离文件变更。"
  t35: "agent 会在接近 token 限制时自动压缩上下文。"
  t36: "Anthropic 模型默认启用提示缓存以降低成本。"
  t37: "文件编辑会触发自动 LSP 诊断——直接在回复中查看错误。"
  t38: "agent 在修改文件前创建 git 检查点，确保随时可以回滚。"
  t39: "启动时使用 --yolo 标志进入完全免审批会话: covo-agent --yolo。"
  t40: "管道使用: echo 'fix the build' | covo-agent --oneshot 2>/dev/null"
  t41: "可以用 /steer 在后台任务执行中期引导它。"
  t42: "切换模式前使用 /save 保存当前对话。"
  t43: "agent 正在输入时按 Enter 可以排队你的下一条消息。"
  t44: "会话状态跨重启持久化——使用 /resume 从上次断点继续。"


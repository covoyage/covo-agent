  t12: "Tired of approving npm install? Choose 'a' for always and never see it again."
  t13: "Type /mode code for a programming-focused agent, or /mode general for all-purpose."
  t14: "Use /background to start a long-running agent task while you keep working."
  t15: "Check running background tasks with /queue."
  t16: "Set COVO_YOLO=1 to start the agent with all approvals bypassed."
  t17: "Add approvals.mode: smart in config.yaml to let a smaller LLM auto-approve safe commands."
  t18: "Use /stats to see your token usage and estimated costs for this session."
  t19: "Type /status for a one-line session overview."
  t20: "Use /provider openai to quickly switch AI providers."
  t21: "Run /skill to see what skills are available for your agent."
  t22: "Type /curator to trigger maintenance that prunes stale skills."
  t23: "Run /skill <name> to inspect a specific skill's usage stats."
  t24: "Use /steer <id> <msg> to give mid-flight instructions to a background task."
  t25: "Type /cancel <id> to stop a background task."
  t26: "During approval prompts: y=once, s=this session, a=always, n=deny."
  t27: "Dangerous command approvals use pattern matching — safe commands like `ls` pass right through."
  t28: "Hardline patterns like `rm -rf /` are blocked even with YOLO mode on."
  t29: "The statusline shows your current mode, git branch, and token usage."
  t30: "Use /statusline to customize what's shown in the status bar."
  t31: "Press Ctrl+C to interrupt the agent mid-response."
  t32: "Press Tab to autocomplete slash commands and @ references."
  t33: "Use Up/Down arrow keys to navigate command history."
  t34: "Use COVO_WORKTREE=true to isolate file changes in a git worktree."
  t35: "The agent automatically compacts context when approaching token limits."
  t36: "Prompt caching is enabled by default on Anthropic models to reduce costs."
  t37: "File edits trigger automatic LSP diagnostics — see errors right in the response."
  t38: "The agent creates git checkpoints before mutating files so you can always roll back."
  t39: "Use --yolo flag at startup for a fully unapproved session: covo-agent --yolo."
  t40: "Pipeline with pipes: echo 'fix the build' | covo-agent --oneshot 2>/dev/null"
  t41: "You can steer a running background task mid-execution with /steer."
  t42: "Use /save before switching modes to preserve your conversation."
  t43: "Press Enter while the agent is typing to queue your next message."
  t44: "Session state persists across restarts — use /resume to continue where you left off."


tips:
  t0: "輸入 /yolo 跳过当前会话所有危险命令的審批。"
  t1: "使用 /retry 用相同提示词重新生成最后一条回复。"
  t2: "使用 /undo 回退 N 轮對話并从那里继续。"
  t3: "用 /model gpt-4o 或 /model claude-sonnet-4 随时切換模型。"
  t4: "輸入 /compact 强制上下文摘要以节省 tokens。"
  t5: "使用 @diff 将未暂存的 git 变更注入提示。"
  t6: "輸入 @file:path/to/file 将檔案内容内联附加。"
  t7: "使用 @git:5 注入最近 5 条 commit 訊息到上下文。"
  t8: "用 /save 儲存会话，之后用 /resume 恢复。"
  t9: "輸入 /memory user 查看 agent 记住的关于你的資訊。"
  t10: "輸入 /memory agent 查看 agent 为当前项目存储的内容。"
  t11: "使用 /rewind 跳回對話的任意早前轮次。"
  t12: "厌倦了審批 npm install？選擇 'a' 永久批准，不再询问。"
  t13: "輸入 /mode code 使用编程专注 agent，或 /mode general 通用模式。"
  t14: "使用 /background 啟用长时间运行的 agent 任务，同时继续工作。"
  t15: "用 /queue 查看正在运行的后台任务。"
  t16: "設定 COVO_YOLO=1 啟用时绕过所有審批。"
  t17: "在 config.yaml 中添加 approvals.mode: smart，让小型 LLM 自动批准安全命令。"
  t18: "使用 /stats 查看本会话的 token 用量和费用预估。"
  t19: "輸入 /status 查看一行式会话概览。"
  t20: "使用 /provider openai 快速切換 AI provider。"
  t21: "运行 /skills 查看 agent 可用的技能列表。"
  t22: "輸入 /curator 触发维护来清理过时技能。"
  t23: "运行 /skill <name> 查看特定技能的使用統計。"
  t24: "使用 /steer <id> <msg> 向运行中的后台任务发送中期指令。"
  t25: "輸入 /cancel <id> 停止后台任务。"
  t26: "審批提示时: y=单次, s=本会话, a=永久, n=拒绝。"
  t27: "危险命令審批使用模式匹配——`ls` 这样的安全命令直接通过。"
  t28: "硬核模式如 `rm -rf /` 即使 YOLO 模式下也会被阻止。"
  t29: "状态栏顯示当前模式、git 分支和 token 用量。"
  t30: "使用 /statusline 自訂状态栏顯示内容。"
  t31: "按 Ctrl+C 中斷 agent 的回复。"
  t32: "按 Tab 自动补全斜杠命令和 @ 引用。"
  t33: "使用 上/下 方向键浏览命令历史。"
  t34: "使用 COVO_WORKTREE=true 在 git worktree 中隔离檔案变更。"
  t35: "agent 会在接近 token 限制时自动壓縮上下文。"
  t36: "Anthropic 模型預設启用提示快取以降低成本。"
  t37: "檔案編輯会触发自动 LSP 诊断——直接在回复中查看错误。"
  t38: "agent 在修改檔案前创建 git 检查点，确保随时可以回滚。"
  t39: "啟用时使用 --yolo 标志进入完全免審批会话: covo-agent --yolo。"
  t40: "管道使用: echo 'fix the build' | covo-agent --oneshot 2>/dev/null"
  t41: "可以用 /steer 在后台任务執行中期引導它。"
  t42: "切換模式前使用 /save 儲存当前對話。"
  t43: "agent 正在輸入时按 Enter 可以排队你的下一条訊息。"
  t44: "会话状态跨重启持久化——使用 /resume 从上次断点继续。"


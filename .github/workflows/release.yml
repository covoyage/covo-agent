name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # CI (ci.yml) already runs go test and go vet on every push to main
  # and every pull request.  Repeating those checks here would only slow
  # down releases without adding value — a tag is always cut from a commit
  # that has already passed CI on main.
  release:
    runs-on: macos-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache-dependency-path: go.sum

      - name: Verify distribution repository token
        env:
          DISTRIBUTION_REPO_TOKEN: ${{ secrets.DISTRIBUTION_REPO_TOKEN }}
        run: test -n "$DISTRIBUTION_REPO_TOKEN"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISTRIBUTION_REPO_TOKEN: ${{ secrets.DISTRIBUTION_REPO_TOKEN }}
